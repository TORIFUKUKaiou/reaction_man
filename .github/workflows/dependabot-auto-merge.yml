name: PR checks and Dependabot auto-merge

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_DEFAULT_INDEX: https://pypi.flatt.tech/simple/
      PIP_INDEX_URL: https://pypi.flatt.tech/simple/
    steps:
      - name: Checkout PR merge commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: '0.13.9'
          python-version: '3.14'
          enable-cache: false

      - name: Install locked Python dependencies
        run: uv sync --locked

      - name: Check Python dependency compatibility
        run: uv pip check

      # Slack や外部サービスにはつながない。app.py は構文だけを確かめる。
      - name: Compile app
        run: uv run --locked python -m py_compile app.py

      - name: Build Docker image
        run: docker build --pull -t app:test .

      # 依存を更新しても読み込めるかを、イメージの中で確かめる。
      # app.py は import しない（読み込むと Slack のトークンや Google の認証を求めるため）。
      - name: Import dependencies in image
        run: docker run --rm --network none app:test python -c "import slack_bolt, slack_bolt.adapter.socket_mode"

  dependabot:
    needs: test
    if: >-
      github.repository == 'TORIFUKUKaiou/reaction_man' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Never checkout PR code, run package scripts, or restore PR caches here.
      - name: Verify Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3.1.0
        with:
          github-token: ${{ github.token }}

      - name: Merge minor and patch updates automatically
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        # needs: test gates merging; reject a PR head updated after this run began.
        run: gh pr merge --squash --match-head-commit "$PR_HEAD_SHA" "$PR_URL"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
